# 데모값 — compose와 같은 값. 실제 운영 secret은 레포에 두지 않는다 (README 참조).
# build_app()이 GATEWAY_JWT_SECRET 미설정 시 기동에서 끊으므로(T2), secretKeyRef 오타는
# Ready인 파드가 전량 500이 아니라 CrashLoopBackOff로 드러난다.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  GATEWAY_JWT_SECRET: demo-secret-do-not-use-in-prod
  ADMIN_TOKEN: demo-admin-token-do-not-use-in-prod
