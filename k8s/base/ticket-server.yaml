apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-server
spec:
  replicas: 1  # 1주차 기준선. ticket-server의 replicas: 3 조용한 소실은 T6에서 재현한다.
  selector:
    matchLabels:
      app: ticket-server
  template:
    metadata:
      labels:
        app: ticket-server
    spec:
      containers:
        - name: ticket-server
          image: agentops-registry:5000/agentops/ticket-server:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8101
          # 백엔드는 /health뿐이다(server.py). 게이트웨이와 달리 능동 probe 대상이 없다.
          startupProbe:
            httpGet:
              path: /health
              port: 8101
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8101
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8101
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-server
spec:
  selector:
    app: ticket-server
  ports:
    - port: 8101
      targetPort: 8101
