apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            # 데모용 익명 접근 — production이면 인증 필수 (compose와 동일)
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            # Ingress를 host가 아니라 path로 가른다 — *.localhost DNS에 기대지 않기 위해서.
            # 그 대가로 grafana가 자기 base path를 알아야 한다.
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:8080/grafana
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: datasources.yml
              readOnly: true
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: config
              mountPath: /var/lib/grafana/dashboards/gateway.json
              subPath: gateway.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
